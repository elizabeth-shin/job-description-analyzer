<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Job Description Analyzer — iCertify</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #F7F6F3;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .page { max-width: 820px; margin: 0 auto; }

  /* API Key banner */
  .api-banner {
    background: #fff;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .api-banner label { font-size: 13px; color: #666; white-space: nowrap; }
  .api-banner input {
    flex: 1;
    min-width: 220px;
    padding: 7px 12px;
    font-size: 13px;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    font-family: monospace;
    background: #fafafa;
  }
  .api-banner input:focus { outline: 2px solid #378ADD; outline-offset: 1px; }
  .api-hint { font-size: 12px; color: #999; width: 100%; }
  .api-hint a { color: #185FA5; }

  /* Header */
  .header { margin-bottom: 1.5rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: #111; }
  .header p { font-size: 14px; color: #666; margin-top: 4px; }

  /* Input card */
  .input-card {
    background: #fff;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .input-card label { font-size: 13px; color: #666; display: block; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    padding: 10px 12px;
    background: #fafafa;
  }
  textarea:focus { outline: 2px solid #378ADD; outline-offset: 1px; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  button.primary {
    background: #111;
    color: #fff;
    border: none;
    padding: 9px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.82; }
  button.primary:disabled { opacity: 0.35; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: #666;
    border: 0.5px solid #ccc;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button.secondary:hover { background: #f5f5f5; }

  .status { font-size: 13px; color: #888; margin-left: 4px; }
  .loader { display: inline-block; width: 13px; height: 13px; border: 2px solid #ddd; border-top-color: #333; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results { display: none; }
  .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .section-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
  .section-card.required .section-title { color: #185FA5; }
  .section-card.preferred .section-title { color: #0F6E56; }
  .section-card.keywords .section-title { color: #993C1D; }
  .section-card.signals .section-title { color: #534AB7; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .tag.required { background: #E6F1FB; color: #0C447C; }
  .tag.preferred { background: #E1F5EE; color: #085041; }
  .tag.keyword { background: #FAECE7; color: #712B13; }
  .tag.signal { background: #EEEDFE; color: #3C3489; }

  .wide-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 12px; }
  .summary-text { font-size: 14px; line-height: 1.65; color: #222; }
  .error-msg { font-size: 14px; color: #A32D2D; padding: 12px; background: #FCEBEB; border-radius: 8px; }

  /* Footer */
  .footer { margin-top: 2.5rem; text-align: center; font-size: 12px; color: #bbb; }
</style>
</head>
<body>
<div class="page">

  <div class="api-banner">
    <label for="api-key">Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
    <div class="api-hint">Get your key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> — usage costs ~$0.001 per analysis.</div>
  </div>

  <div class="header">
    <h1>Job Description Analyzer</h1>
    <p>Paste any job description to extract required skills, preferred skills, ATS keywords, and seniority signals.</p>
  </div>

  <div class="input-card">
    <label for="jd-input">Job description</label>
    <textarea id="jd-input" placeholder="Paste the full job description here..."></textarea>
    <div class="btn-row">
      <button class="primary" id="analyze-btn" onclick="analyze()">Analyze</button>
      <button class="secondary" onclick="clearAll()">Clear</button>
      <span class="status" id="status-msg"></span>
    </div>
  </div>

  <div class="results" id="results-area"></div>

  <div class="footer">Powered by Claude · Built for iCertify</div>
</div>

<script>
async function analyze() {
  const jd = document.getElementById('jd-input').value.trim();
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) { setStatus('Please enter your Anthropic API key above.'); return; }
  if (!jd) { setStatus('Please paste a job description first.'); return; }

  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  setStatus('<span class="loader"></span>Analyzing...');
  document.getElementById('results-area').style.display = 'none';

  const systemPrompt = `You are an expert ATS and career coach analyzer. Given a job description, extract and return ONLY a valid JSON object with these exact keys:
{
  "summary": "2-sentence role summary",
  "required_skills": ["skill1", "skill2"],
  "preferred_skills": ["skill1", "skill2"],
  "ats_keywords": ["keyword1", "keyword2"],
  "seniority_signals": ["signal1", "signal2"],
  "title": "Inferred job title",
  "level": "Junior | Mid-Level | Senior | Lead | Executive"
}
Rules: required_skills = must-have skills explicitly stated. preferred_skills = nice-to-have. ats_keywords = exact phrases an ATS would scan for. seniority_signals = phrases revealing experience level. Return ONLY the JSON, no markdown, no explanation.`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: jd }]
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content?.map(b => b.text || '').join('') || '';
    const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
    renderResults(parsed);
    setStatus('');
  } catch(e) {
    document.getElementById('results-area').innerHTML = `<div class="error-msg">Error: ${e.message || 'Something went wrong. Check your API key and try again.'}</div>`;
    document.getElementById('results-area').style.display = 'block';
    setStatus('');
  }
  btn.disabled = false;
}

function renderResults(d) {
  const area = document.getElementById('results-area');
  const tagHTML = (items, cls) => items && items.length
    ? items.map(s => `<span class="tag ${cls}">${s}</span>`).join('')
    : '<span style="font-size:13px;color:#999">None identified</span>';

  area.innerHTML = `
    <div class="wide-card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <div>
        <div class="section-title" style="color:#666;">Role</div>
        <div style="font-size:18px;font-weight:600;color:#111">${d.title || 'Role'}</div>
      </div>
      <div style="margin-left:auto;">
        <span class="tag signal" style="font-size:13px;padding:5px 14px;">${d.level || 'Unknown level'}</span>
      </div>
    </div>
    <div class="wide-card">
      <div class="section-title" style="color:#666;">Summary</div>
      <div class="summary-text">${d.summary || ''}</div>
    </div>
    <div class="section-grid">
      <div class="section-card required">
        <div class="section-title">Required skills</div>
        <div class="tag-list">${tagHTML(d.required_skills, 'required')}</div>
      </div>
      <div class="section-card preferred">
        <div class="section-title">Preferred skills</div>
        <div class="tag-list">${tagHTML(d.preferred_skills, 'preferred')}</div>
      </div>
    </div>
    <div class="section-grid">
      <div class="section-card keywords">
        <div class="section-title">ATS keywords</div>
        <div class="tag-list">${tagHTML(d.ats_keywords, 'keyword')}</div>
      </div>
      <div class="section-card signals">
        <div class="section-title">Seniority signals</div>
        <div class="tag-list">${tagHTML(d.seniority_signals, 'signal')}</div>
      </div>
    </div>
  `;
  area.style.display = 'block';
}

function clearAll() {
  document.getElementById('jd-input').value = '';
  document.getElementById('results-area').style.display = 'none';
  document.getElementById('results-area').innerHTML = '';
  setStatus('');
}
function setStatus(msg) { document.getElementById('status-msg').innerHTML = msg; }
</script>
</body>
</html>
